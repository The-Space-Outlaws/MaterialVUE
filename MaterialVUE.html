<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>MaterialVUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0">
<style>
:root {
  color-scheme: light dark;
  --md-sys-color-primary: #6750A4; --md-sys-color-on-primary: #fff;
  --md-sys-color-primary-container: #EADDFF; --md-sys-color-on-primary-container: #21005D;
  --md-sys-color-secondary: #625B71; --md-sys-color-on-secondary: #fff;
  --md-sys-color-secondary-container: #E8DEF8; --md-sys-color-on-secondary-container: #1D192B;
  --md-sys-color-tertiary-container: #FFD8E4; --md-sys-color-on-tertiary-container: #31111D;
  --md-sys-color-error: #B3261E; --md-sys-color-on-error: #fff; --md-sys-color-error-container: #F9DEDC; --md-sys-color-on-error-container: #410E0B;
  --md-sys-color-surface: #FEF7FF; --md-sys-color-on-surface: #1D1B20; --md-sys-color-on-surface-variant: #49454F;
  --md-sys-color-surface-container: #F3EDF7; --md-sys-color-surface-container-high: #ECE6F0;
  --md-sys-color-surface-container-highest: #E6E0E9;
  --md-sys-color-outline: #79747E; --md-sys-color-outline-variant: #CAC4D0;
  --ok: #146C2E; --ok-c: #C4EED0; --warn: #B26A00; --warn-c: #FFDF9E; --info: #00629D; --info-c: #CFE5FF;
  --md-ref-typeface-brand: Roboto; --md-ref-typeface-plain: Roboto;
  --banner-h: 0px; /* height of the logging notice, set from JS */
}
@media (prefers-color-scheme: dark) {
  :root {
    --md-sys-color-primary: #D0BCFF; --md-sys-color-on-primary: #381E72;
    --md-sys-color-primary-container: #4F378B; --md-sys-color-on-primary-container: #EADDFF;
    --md-sys-color-secondary: #CCC2DC; --md-sys-color-on-secondary: #332D41;
    --md-sys-color-secondary-container: #4A4458; --md-sys-color-on-secondary-container: #E8DEF8;
    --md-sys-color-tertiary-container: #633B48; --md-sys-color-on-tertiary-container: #FFD8E4;
    --md-sys-color-error: #F2B8B5; --md-sys-color-on-error: #601410; --md-sys-color-error-container: #8C1D18; --md-sys-color-on-error-container: #F9DEDC;
    --md-sys-color-surface: #141218; --md-sys-color-on-surface: #E6E0E9; --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-surface-container: #211F26; --md-sys-color-surface-container-high: #2B2930;
    --md-sys-color-surface-container-highest: #36343B;
    --md-sys-color-outline: #938F99; --md-sys-color-outline-variant: #49454F;
    --ok: #A8DAB5; --ok-c: #0F5223; --warn: #FFB74D; --warn-c: #5A4300; --info: #9ECAFF; --info-c: #00497A;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); }
.muted { color: var(--md-sys-color-on-surface-variant); }

/* logging notice */
#notice { position: sticky; top: 0; z-index: 20; display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.45; }
#notice.raw { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }
#notice.redacted { background: var(--warn-c); color: var(--md-sys-color-on-surface); }
#notice .ntext { flex: 1; min-width: 0; padding-top: 2px; }
#notice .nclose { flex: none; width: 32px; height: 32px; margin: -4px -4px -4px 0; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; }
#notice .nclose:hover { background: color-mix(in srgb, currentColor 12%, transparent); }

/* login */
#login { min-height: calc(100dvh - var(--banner-h)); display: grid; place-items: center; padding: 16px; }
#form { width: min(440px, 100%); background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
#form h1 { margin: 0; font-size: 32px; font-weight: 500; }
#form p { margin: 0 0 8px; font-size: 14px; }
#form md-filled-text-field { width: 100%; }
#err { color: var(--md-sys-color-error); font-size: 14px; }
#signin { align-self: flex-end; }

/* app shell */
#app { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100dvh - var(--banner-h)); }
nav { background: var(--md-sys-color-surface-container); padding: 24px 12px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: var(--banner-h); height: calc(100dvh - var(--banner-h)); }
.brand { font-size: 22px; font-weight: 500; padding: 0 16px; color: var(--md-sys-color-primary); }
.me { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
.me > div:last-child { min-width: 0; font-size: 14px; }
.me b { display: block; font-weight: 500; font-size: 16px; color: var(--md-sys-color-on-surface); overflow-wrap: anywhere; }
.photo { width: 64px; height: 64px; flex: none; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface-variant); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nav-item { position: relative; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border: 0; border-radius: 28px; background: none; color: var(--md-sys-color-on-surface-variant); font: 500 14px Roboto, sans-serif; cursor: pointer; text-align: left; }
.nav-item.selected { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.spacer { flex: 1; }
main { padding: 24px 32px 48px; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.top h2 { margin: 0; font-size: 32px; font-weight: 400; flex: 1; }
#periods md-outlined-select { min-width: 200px; }
#bar { position: fixed; top: var(--banner-h); left: 0; right: 0; z-index: 5; }

/* gradebook */
#content { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.msg { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 24px; border-radius: 24px; background: var(--md-sys-color-surface-container); }
.course { background: var(--md-sys-color-surface-container); border-radius: 24px; overflow: hidden; }
.course-head { position: relative; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 20px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.course-head .meta { grid-column: 1 / -1; }
.course-title { font-size: 20px; font-weight: 500; line-height: 1.25; }
.course-sub { font-size: 14px; margin-top: 4px; color: var(--md-sys-color-on-surface-variant); }
.chips { display: flex; gap: 8px; margin-bottom: 8px; }
.chip { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 8px; background: var(--md-sys-color-surface-container-highest); }
.chip.new { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.badge { width: 72px; height: 72px; border-radius: 24px; display: grid; place-content: center; text-align: center; font-size: 28px; font-weight: 500; line-height: 1; }
.badge.long { font-size: 16px; }
.badge small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; }
.g-a { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.g-b { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.g-c { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
.g-d { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
.g-n { background: var(--md-sys-color-surface-container-highest); }
md-linear-progress { width: 100%; --md-linear-progress-track-shape: 4px; --md-linear-progress-active-indicator-height: 6px; --md-linear-progress-track-height: 6px; }
.assign { border-top: 1px solid var(--md-sys-color-outline-variant); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 20px; }
.row + .row { border-top: 1px solid var(--md-sys-color-outline-variant); }
.row-name { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; overflow-wrap: anywhere; }
.row-score { text-align: right; font-weight: 500; white-space: nowrap; }

#content.list { grid-template-columns: 1fr; max-width: 900px; gap: 8px; }
.raw { background: var(--md-sys-color-surface-container); border-radius: 16px; overflow: hidden; }
.raw summary { display: flex; align-items: center; gap: 16px; padding: 14px 20px; cursor: pointer; list-style: none; }
.raw summary::-webkit-details-marker { display: none; }
.raw summary { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
pre { margin: 0; padding: 12px 20px; overflow: auto; max-height: 320px; font-size: 12px; background: var(--md-sys-color-surface-container-highest); }

.loading { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 96px 0; color: var(--md-sys-color-on-surface-variant); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; margin-bottom: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-head b { flex: 1; text-align: center; font-size: 20px; font-weight: 500; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { text-align: center; font-size: 12px; font-weight: 500; padding: 4px 0; color: var(--md-sys-color-on-surface-variant); }
.day { position: relative; min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px; border: 0; border-radius: 16px; background: var(--md-sys-color-surface-container); color: inherit; font: inherit; text-align: left; }
button.day { cursor: pointer; background: var(--md-sys-color-surface-container-high); }
.day.out { background: none; }
.day.today .dn { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.day.sel { outline: 2px solid var(--md-sys-color-primary); }
.dn { font-size: 13px; min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.ic { --md-icon-size: 22px; font-variation-settings: 'FILL' 1; flex: none; } /* filled Material Symbol, like the old portal icons */
.k-excused { color: var(--ok); }
.k-tardy { color: var(--warn); }
.k-unexcused, .k-utardy { color: var(--md-sys-color-error); }
.k-activity { color: var(--info); }
.k-notsched, .k-other { color: var(--md-sys-color-outline); }
.detail { margin-top: 16px; }
.detail .row { justify-content: flex-start; align-items: center; }
.section-title { font-size: 14px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); padding: 8px 4px 0; }

/* class schedules */
.pf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.pf .section-title { padding: 0 8px 0 0; }
.pchip { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline); background: none; color: var(--md-sys-color-on-surface-variant); font: 500 14px Roboto, sans-serif; cursor: pointer; }
.pchip[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; }
.note { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin: 0 4px 12px; }
main.centered .top { max-width: 640px; margin-inline: auto; }
#content.center { max-width: 640px; margin-inline: auto; }
.pf { justify-content: center; }
.pf .section-title { display: none; }
.sched { background: var(--md-sys-color-surface-container); border-radius: 28px; overflow: hidden; }
.sched-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 16px; align-items: center; padding: 16px 20px; }
.sched-row + .sched-row { border-top: 1px solid var(--md-sys-color-outline-variant); }
.pnum { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 500; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.sched-title { font-size: 17px; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.sched-sub { font-size: 14px; margin-top: 2px; color: var(--md-sys-color-on-surface-variant); overflow-wrap: anywhere; }
.room { font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 8px; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); white-space: nowrap; text-align: center; }

/* hall pass */
.hp-form { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.hp-form h3 { margin: 0; font-size: 22px; font-weight: 500; }
.hp-form md-outlined-select { width: 100%; }
.hp-form md-filled-button { align-self: flex-end; }
.hp-card { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 24px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.hp-name { font-size: 24px; font-weight: 500; line-height: 1.2; margin: 8px 0 12px; overflow-wrap: anywhere; }
.hp-line { display: flex; align-items: center; gap: 10px; font-size: 16px; margin-top: 8px; }
.hp-line md-icon { color: var(--md-sys-color-on-surface-variant); }
.st { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 8px; }
.st-active { background: var(--ok-c); color: var(--ok); }
.st-pending { background: var(--warn-c); color: var(--warn); }
.hp-ring { position: relative; width: 148px; height: 148px; }
.hp-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.hp-ring .track { fill: none; stroke: var(--md-sys-color-surface-container-highest); stroke-width: 10; }
.hp-ring .bar { fill: none; stroke: var(--md-sys-color-primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .3s; }
.hp-ring .bar.low { stroke: var(--md-sys-color-error); }
.hp-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.hp-center b { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
.hp-center small { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.hp-x { position: absolute; top: -8px; right: -8px; width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
.hp-x:disabled { opacity: .5; cursor: default; }
.hp-note { margin: 12px 4px 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); text-align: center; }
.hp-err { margin-top: 12px; }

/* login: remember me + continue */
.remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--md-sys-color-on-surface-variant); cursor: pointer; }
#resume-wrap { display: flex; flex-direction: column; gap: 4px; }
#resume { width: 100%; }
.link-btn { align-self: center; border: 0; background: none; padding: 8px 12px; border-radius: 16px; color: var(--md-sys-color-primary); font: 500 14px Roboto, sans-serif; cursor: pointer; }

/* settings */
.set-wrap { display: flex; flex-direction: column; gap: 16px; }
.set-card { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.set-card h3 { margin: 0; font-size: 22px; font-weight: 500; }
.set-card > md-outlined-button, .set-card > md-text-button { align-self: flex-start; }
.chiprow, .swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sw { position: relative; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 2px solid var(--md-sys-color-outline-variant); display: grid; place-items: center; cursor: pointer; color: #fff; overflow: hidden; }
.sw[aria-pressed="true"] { border-color: var(--md-sys-color-on-surface); box-shadow: 0 0 0 2px var(--md-sys-color-surface-container), 0 0 0 4px var(--md-sys-color-primary); }
.sw.custom { background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); }
.sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.ord-row { display: flex; align-items: center; gap: 12px; }
.ord-row md-icon { color: var(--md-sys-color-on-surface-variant); }
.ord-row .grow { flex: 1; font-size: 16px; }

@media (max-width: 839px) {
  .hp-card { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .hp-line { justify-content: center; }
}
@media (max-width: 839px) {
  #app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; flex-direction: row; align-items: center; padding: 12px; overflow-x: auto; }
  .brand, .me, .spacer { display: none; }
  .nav-item { height: 48px; }
  main { padding: 16px 16px 48px; }
  #content { grid-template-columns: 1fr; }
  .day { min-height: 56px; padding: 4px; }
  .sched-row { grid-template-columns: 44px 1fr; padding: 14px 16px; gap: 12px; }
  .pnum { width: 44px; height: 44px; font-size: 18px; }
  .room { grid-column: 2; justify-self: start; }
  .ic { --md-icon-size: 18px; }
}
</style>
</head>
<body>

<div id="notice" aria-live="polite" hidden></div>

<section id="login" hidden>
  <form id="form" novalidate>
    <h1>MaterialVUE</h1>
    <p class="muted">Sign in with your StudentVUE account.</p>
    <md-filled-text-field id="url" label="StudentVUE URL" type="url" placeholder="studentvue.yourdistrict.org" autocomplete="url" required></md-filled-text-field>
    <md-filled-text-field id="user" label="Username" autocomplete="username" required></md-filled-text-field>
    <md-filled-text-field id="pass" label="Password" type="password" autocomplete="current-password" required></md-filled-text-field>
    <div id="zipwrap" hidden>
      <md-filled-text-field id="zip" label="District ZIP code" inputmode="numeric" maxlength="5"></md-filled-text-field>
    </div>
    <label class="remember"><md-checkbox id="remember" touch-target="wrapper" checked></md-checkbox><span>Remember me on this device (not for shared computers)</span></label>
    <div id="err" role="alert" hidden></div>
    <md-filled-button id="signin" type="submit">Sign in</md-filled-button>
    <div id="resume-wrap" hidden>
      <md-outlined-button id="resume" type="button"></md-outlined-button>
      <button type="button" class="link-btn" id="forget-login">Not you? Forget this device</button>
    </div>
  </form>
</section>

<div id="app" hidden>
  <nav>
    <div class="brand">MaterialVUE</div>
    <button class="nav-item selected" data-tool="gradebook"><md-ripple></md-ripple><md-icon>grading</md-icon>Gradebook</button>
    <button class="nav-item" data-tool="attendance"><md-ripple></md-ripple><md-icon>event_available</md-icon>Attendance</button>
    <button class="nav-item" data-tool="schedule"><md-ripple></md-ripple><md-icon>schedule</md-icon>Class Schedules</button>
    <button class="nav-item" data-tool="hallpass"><md-ripple></md-ripple><md-icon>directions_walk</md-icon>Hall Pass</button>
    <div class="spacer"></div>
    <div class="me" id="me" hidden>
      <div class="photo" id="photo"><md-icon>person</md-icon></div>
      <div class="muted"><b id="hello"></b><span id="school"></span></div>
    </div>
    <button class="nav-item" data-tool="settings"><md-ripple></md-ripple><md-icon>settings</md-icon>Settings</button>
    <button class="nav-item" id="signout"><md-ripple></md-ripple><md-icon>logout</md-icon>Sign out</button>
  </nav>
  <main>
    <md-linear-progress id="bar" indeterminate hidden></md-linear-progress>
    <div class="top">
      <h2 id="title">Gradebook</h2>
      <div id="periods"></div>
      <md-icon-button id="refresh" aria-label="Refresh"><md-icon>refresh</md-icon></md-icon-button>
    </div>
    <div id="content"></div>
  </main>
</div>

<script type="module" nonce="{{NONCE}}">
import 'https://esm.run/@material/web@2.3.0/all.js';

const $ = (s) => document.querySelector(s);
// Builds DOM with textContent only, so server data can never inject HTML.
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v);
  }
  el.append(...kids.flat().filter((x) => x != null && x !== false));
  return el;
};

let sid = sessionStorage.getItem('mv_sid'); // shortcut: sessionStorage survives refresh, dies with the tab
const show = (which) => { $('#login').hidden = which !== 'login'; $('#app').hidden = which !== 'app'; };
const loginErr = (m) => { $('#err').textContent = m || ''; $('#err').hidden = !m; };

async function api(path, body, bg) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(sid && { Authorization: 'Bearer ' + sid }), ...(bg && { 'X-MV-Bg': '1' }) }, // bg = the page's own polling, not user activity
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => ({ error: 'Bad response from server' }));
  if (r.status === 401 && sid) { signOut('Session expired. Please sign in again.'); throw new Error('expired'); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

// StudentVUE answers HTTP 200 even on failure; the real error is in the envelope.
async function sv(method, inner, bg) {
  const j = await api('/api/' + method, inner, bg);
  if (j.error) { const e = new Error(j.error.message || 'StudentVUE error'); e.code = String(j.error.code); throw e; }
  return j.data;
}

// Assignment field names are undocumented for this API, so try likely names and fall back gracefully.
const pick = (o, keys) => { for (const k of keys) if (o[k] != null && o[k] !== '' && typeof o[k] !== 'object') return o[k]; return null; };
const NAME = ['measure', 'name', 'assignmentName', 'title', 'gradebookName'];
const TYPE = ['type', 'category', 'assignmentType'];
const DATE = ['date', 'dueDate', 'startDate'];
const SCORE = ['displayScore', 'score', 'pointsEarned', 'earnedPoints'];
const PTS = ['points', 'maxPoints', 'possiblePoints'];
const NOTES = ['notes', 'description'];
const toTime = (s) => { const m = /(\d+)\/(\d+)\/(\d+)/.exec(s || ''); return m ? new Date(m[3], m[1] - 1, m[2]).getTime() : 0; };

const loading = (item) => $('#content').replaceChildren(h('div', { class: 'loading', role: 'status' }, h('md-circular-progress', { indeterminate: true, 'aria-label': 'Loading' }), `Loading ${item} from StudentVUE`));

function renderGradebook(t, standards, requested) {

function courseCard(c) {
  const m = c.marks?.[0] || {};
  const pct = parseFloat(m.calculatedScoreRaw);
  const label = String(m.calculatedScoreString ?? 'N/A');
  const tone = isNaN(pct) ? 'g-n' : pct >= 90 ? 'g-a' : pct >= 80 ? 'g-b' : pct >= 70 ? 'g-c' : 'g-d';
  const items = (m.assignments || []).slice().sort((a, b) => toTime(pick(b, DATE)) - toTime(pick(a, DATE)));
  const fresh = m.assignmentsSinceLastAccess?.length || 0;

  const list = h('div', { class: 'assign', hidden: true },
    ...(items.length ? items.map(assignRow) : [h('div', { class: 'row muted' }, 'No assignments yet.')]));
  const card = h('div', { class: 'course' });
  const head = h('button', {
    class: 'course-head', 'aria-expanded': 'false',
    onclick() { list.hidden = !list.hidden; head.setAttribute('aria-expanded', String(!list.hidden)); },
  },
    h('md-ripple'),
    h('div', {},
      h('div', { class: 'chips' },
        c.period ? h('span', { class: 'chip' }, 'Period ' + c.period) : null,
        fresh ? h('span', { class: 'chip new' }, fresh + ' new') : null),
      h('div', { class: 'course-title' }, c.title || c.courseName || 'Course'),
      h('div', { class: 'course-sub' }, [c.staff, c.room && 'Room ' + c.room].filter(Boolean).join(' · '))),
    h('div', { class: `badge ${tone}${label.length > 3 ? ' long' : ''}` }, label,
      isNaN(pct) ? null : h('small', {}, pct.toFixed(1) + '%')),
    h('div', { class: 'meta' }, isNaN(pct) ? null : h('md-linear-progress', { value: Math.min(Math.max(pct, 0), 100) / 100 })));
  card.append(head, list);
  return card;
}

function assignRow(a) {

/* ---------- attendance ---------- */
// Shapes verified from a real log: periodAttendance.absences[] = { absenceDate, reason, note, dailyIconName, codeAllDayDescription,
// periods[] = { number, name, reason, course, staff, iconName } }. The old portal's gif icons are mapped to kinds by name.
const KINDS = {
  excused: ['Excused', 'check_circle'], tardy: ['Tardy', 'schedule'], unexcused: ['Unexcused', 'cancel'],
  utardy: ['Unexcused tardy', 'alarm'], activity: ['Activity', 'flag'], notsched: ['Not scheduled', 'block'], other: ['Other', 'info'],
};
const kindOf = (...s) => {
  const t = s.filter(Boolean).join(' ').toLowerCase();
  return /not.?sched/.test(t) ? 'notsched' : /(unx|unexcused).*tard|tard.*(unx|unexcused)/.test(t) ? 'utardy' : /tard/.test(t) ? 'tardy'
    : /unx|unexcused|absent/.test(t) ? 'unexcused' : /excused/.test(t) ? 'excused' : /activity|suspension/.test(t) ? 'activity' : t ? 'other' : null;
};
const icon = (k) => h('md-icon', { class: 'ic k-' + k, title: KINDS[k][0] }, KINDS[k][1]);
const ymd = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

let att = new Map(), view = new Date(), picked = null; // att: "y-m-d" -> { kinds, periods, e }
function buildAtt(entries) {
  att = new Map();
  for (const e of entries) {
    const m = /(\d+)\/(\d+)\/(\d+)/.exec(e.absenceDate || '');
    if (!m) continue;
    const key = `${m[3]}-${+m[1]}-${+m[2]}`;
    if (att.has(key)) continue; // same day in two lists: first wins
    const periods = (e.periods || []).map((p) => ({ ...p, kind: kindOf(p.iconName, p.name, p.reason) })).filter((p) => p.kind);
    const kinds = [...new Set([kindOf(e.dailyIconName, e.codeAllDayDescription, e.reason), ...periods.map((p) => p.kind)].filter(Boolean))];
    att.set(key, { e, periods, kinds: kinds.length ? kinds : ['other'], date: new Date(+m[3], m[1] - 1, +m[2]) });
  }
}

function renderAtt() {
  const y = view.getFullYear(), mo = view.getMonth(), now = new Date();
  const dates = [...att.values()].map((v) => v.date.getTime());
  const lo = new Date(Math.min(...dates, now.getTime())), hi = new Date(Math.max(...dates, now.getTime()));
  const idx = (d) => d.getFullYear() * 12 + d.getMonth(), cur = y * 12 + mo;
  const go = (n) => { view = new Date(y, mo + n, 1); picked = null; renderAtt(); };
  const counts = {};
  for (const v of att.values()) for (const k of v.kinds) counts[k] = (counts[k] || 0) + 1;

  const cells = Array.from({ length: new Date(y, mo, 1).getDay() }, () => h('div', { class: 'day out' }));
  for (let n = 1; n <= new Date(y, mo + 1, 0).getDate(); n++) {
    const key = `${y}-${mo + 1}-${n}`, v = att.get(key);
    const cls = 'day' + (key === ymd(now) ? ' today' : '') + (key === picked ? ' sel' : '');
    cells.push(v
      ? h('button', { class: cls, 'aria-label': `${v.e.absenceDate}: ${v.kinds.map((k) => KINDS[k][0]).join(', ')}`, onclick() { picked = key; renderAtt(); } },
        h('md-ripple'), h('span', { class: 'dn' }, n), h('span', { class: 'dots' }, ...v.kinds.map(icon)))
      : h('div', { class: cls }, h('span', { class: 'dn' }, n)));
  }

  const sel = att.get(picked);
  $('#content').replaceChildren(h('div', {},
    h('div', { class: 'legend' }, ...Object.keys(KINDS).filter((k) => counts[k]).map((k) => h('span', {}, icon(k), `${KINDS[k][0]} (${counts[k]})`))),
    h('div', { class: 'cal-head' },
      h('md-icon-button', { 'aria-label': 'Previous month', disabled: cur <= idx(lo), onclick: () => go(-1) }, h('md-icon', {}, 'chevron_left')),
      h('b', {}, view.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })),
      h('md-icon-button', { 'aria-label': 'Next month', disabled: cur >= idx(hi), onclick: () => go(1) }, h('md-icon', {}, 'chevron_right'))),
    h('div', { class: 'cal' }, ...['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => h('div', { class: 'wd' }, d)), ...cells),
    sel ? h('div', { class: 'course detail' },
      h('div', { class: 'row' }, ...sel.kinds.map(icon),
        h('div', {}, h('div', { class: 'row-name' }, sel.date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })),
          h('div', { class: 'row-sub' }, [sel.e.codeAllDayDescription || sel.e.reason, sel.e.note].filter(Boolean).join(' · ') || sel.kinds.map((k) => KINDS[k][0]).join(', ')))),
      ...sel.periods.map((p) => h('div', { class: 'row' }, icon(p.kind),
        h('div', {}, h('div', { class: 'row-name' }, `Period ${p.number} · ${p.course || ''}`),
          h('div', { class: 'row-sub' }, [p.name || KINDS[p.kind][0], p.reason, p.staff].filter(Boolean).join(' · ')))))) : null));
}

/* ---------- class schedules ---------- */
let sch = null, schTerm = null, schPeriods = new Set(); // sch = { terms[] }; schPeriods empty = all periods
const parseDate = (s) => { const m = /(\d+)\/(\d+)\/(\d+)/.exec(s || ''); return m ? new Date(+m[3], m[1] - 1, +m[2]) : null; };
const perNum = (p) => { const n = parseFloat(p); return isNaN(n) ? Infinity : n; };
const byPeriod = (a, b) => perNum(a) - perNum(b) || String(a).localeCompare(String(b));

function termsOf(d) {
  const all = d?.studentClassScheduleForAllTerms;
  if (all?.studentClassScheduleForTerms?.length) {
    const info = new Map((all.termLists || []).map((t) => [String(t.termIndex), t]));
    return all.studentClassScheduleForTerms.map((t, i) => {
      const n = info.get(String(t.thisTermIndex)) || {};
      return { index: String(t.thisTermIndex ?? i), name: n.termName || t.thisTermIndexName || 'Term ' + (i + 1),
        begin: parseDate(t.beginDate || n.beginDate), end: parseDate(t.endDate || n.endDate), classes: t.classLists || [] };
    });
  }
  const one = d?.studentClassSchedule; // single-term shape
  return one?.classLists ? [{ index: '0', name: one.termIndexName || 'Current term', begin: null, end: null, classes: one.classLists }] : [];
}

async function loadSchedule(force) {
  if (force || !sch) {
    $('#bar').hidden = false;
    loading('class schedule');
    try {
      const d = await sv('StudentClassList', { childIntID: 0, loadAllTerms: true, conSchOrgYearGU: '', conSchTermIndex: '-1', termIndex: '-1' });
      if (tool !== 'schedule') return;
      const terms = termsOf(d);
      if (!terms.length) { $('#periods').replaceChildren(); return message('No class schedule found.'); }
      const now = new Date();
      const inTerm = terms.find((t) => t.begin && t.end && now >= t.begin && now <= new Date(t.end.getTime() + 864e5 - 1));
      const api = String(d.studentClassScheduleForAllTerms?.termIndex ?? '');
      sch = { terms };
      schPeriods = new Set();
      schTerm = (inTerm || terms.find((t) => t.index === api) || terms[0]).index;
    } catch (e) {
      if (e.message === 'expired' || tool !== 'schedule') return;
      message(e.code === '2100' ? "Class schedules aren't available for this school." : e.message, 'error');
      return;
    } finally { $('#bar').hidden = true; }
  }
  showSchedule();
}

function showSchedule() {
  const t = sch.terms.find((x) => x.index === schTerm) || sch.terms[0];
  $('#periods').replaceChildren(
    h('md-outlined-select', { label: 'Quarter / term', onchange: (e) => { schTerm = e.target.value; schPeriods = new Set(); showSchedule(); } },
      ...sch.terms.map((x) => h('md-select-option', { value: x.index, selected: x.index === t.index }, h('div', { slot: 'headline' }, x.name)))));
  renderSchedule(t);

function renderSchedule(t) {
  const classes = t.classes.filter((c) => !c.excludePVUE);
  const all = [...new Set(classes.map((c) => String(c.period ?? '')))].sort(byPeriod);
  const chip = (label, on, fn) => h('button', { class: 'pchip', 'aria-pressed': String(on), onclick: fn }, label);
  const toggle = (p) => { schPeriods.has(p) ? schPeriods.delete(p) : schPeriods.add(p); renderSchedule(t); };
  const rows = classes.filter((c) => !schPeriods.size || schPeriods.has(String(c.period ?? ''))).sort((a, b) => byPeriod(a.period, b.period));
  $('#content').replaceChildren(h('div', {},
    h('div', { class: 'pf' },
      chip('All', !schPeriods.size, () => { schPeriods = new Set(); renderSchedule(t); }),
      ...all.map((p) => chip(p || '?', schPeriods.has(p), () => toggle(p)))),
    rows.length ? h('div', { class: 'sched' }, ...rows.map((c) => h('div', { class: 'sched-row' },
      h('div', { class: 'pnum', 'aria-label': 'Period ' + (c.period ?? '?') }, String(c.period ?? '?')),
      h('div', {},
        h('div', { class: 'sched-title' }, c.courseTitle || 'Class'),
        h('div', { class: 'sched-sub' }, [c.teacher, typeof c.meetingDays === 'string' && c.meetingDays].filter(Boolean).join(' · '))),
      c.roomName ? h('div', { class: 'room' }, c.roomName) : null)))
      : h('div', { class: 'msg' }, h('md-icon', {}, 'info'), 'No classes match the selected periods.')));
}

/* ---------- hall pass ---------- */
// GROUNDED (seen in a real GetChildListData response): children.showStudentHallPass, children.hallPassCountUp, and per child
//   studentHallPassGU, hallPassStatus, hallPassRequestDate / hallPassApproveDate / hallPassEndDate, hallPassMessageString,
//   hallPassCountToday, hallPassRestrictData { hallPassDisabled, hasLimitDefined, passLimit }.  That is what drives the card and the auto-update.
// UNVERIFIED (the API doc lists only method names): GetHallPassSetup's room list, GetHallPassData's destination/minutes, and UpdateHallPass's
// request fields. Those are read tolerantly / sent as a superset. Run the backend with --log-raw once and the exact names can be pinned down.
const HP = { setup: null, rooms: [], maxMin: null, sel: { room: '', minutes: '' }, pass: null, info: {}, flags: {}, name: '', today: 0, restrict: {},
  allowEnd: false, setupCountUp: false, err: '', busy: false, key: '', loaded: false, poll: null, tick: null, ended: new Set(), seen: new Map(), rawSetup: null };
const MIN_OPTIONS = [2, 3, 4, 5, 10, 15, 20, 30, 45, 60];

function parseDT(s) {
  if (!s || typeof s !== 'string') return null;
  const t = Date.parse(s);
  if (!isNaN(t) && /\d{4}-\d{2}-\d{2}/.test(s)) return t;
  const m = /(\d+)\/(\d+)\/(\d+)[ T,]+(\d+):(\d+)(?::(\d+))?\s*([AaPp][Mm])?/.exec(s);
  if (m) {
    let hr = +m[4];
    if (m[7]) hr = (hr % 12) + (/p/i.test(m[7]) ? 12 : 0);
    return new Date(+m[3], m[1] - 1, +m[2], hr, +m[5], +(m[6] || 0)).getTime();
  }
  return isNaN(t) ? null : t;
}

function statusKind(raw, approve) {
  const t = String(raw || '').toLowerCase().trim();
  if (!t) return 'none';
  if (/\b(end|complet|return|cancel|expir|deni|reject|done|clos|void)/.test(t)) return 'ended'; // word starts only: "Pending" contains "end"
  if (/\b(pend|request|wait|await|submit)/.test(t)) return 'pending';
  if (/\b(activ|approv|out|progress|current|issued|gone|start)/.test(t)) return 'active';
  return approve ? 'active' : 'pending'; // unknown wording: an approve date means somebody approved it
}

const scan = (v, re, test, skipArr = false, d = 0) => { // first scalar under a key matching re (depth-first)
  if (!v || typeof v !== 'object' || d > 8 || (skipArr && Array.isArray(v))) return null;
  for (const [k, x] of Object.entries(v)) if (re.test(k) && x != null && typeof x !== 'object' && test(x)) return x;
  for (const x of Object.values(v)) { const r = scan(x, re, test, skipArr, d + 1); if (r != null) return r; }
  return null;
};

function findRooms(v) {
  // Real setup shape (from a log): hallPassRoomSetupXML = { hallPassMaxDaysForFuturePass, hallPassCountUp, allowStudentsToEndHallPass, hallPassRoomTypes: [] }.
  // Element fields of hallPassRoomTypes are unseen (the list was empty), so names are matched loosely, and only arrays whose path says room/type/destination/location count.
  const PRIMARY = /^(name|room|destination|location|description|title|text)$|(room|destination|location|type).*(name|desc)/i;
  let best = { score: -1, list: [] };
  const walk = (x, path, d) => {

    if (Array.isArray(x) && x.length && /room|destination|location|type/i.test(path) && x.every((o) => o && typeof o === 'object' && !Array.isArray(o))) {
      const rows = x.map((o) => {

        const keys = Object.keys(o);
        const nk = keys.find((k) => PRIMARY.test(k) && ok(k)) || keys.find((k) => /name$/i.test(k) && ok(k));
        const gk = keys.find((k) => /(gu|id)$/i.test(k) && ok(k));
        const mk = keys.find((k) => /(max.*(min|time)|time.?limit|minutes)/i.test(k) && Number(o[k]) > 0);

async function refreshHP() {

  const ch = d?.children, c = ch?.childrenList?.[0] || {};
  HP.flags = { enabled: ch?.showStudentHallPass !== false, countUp: !!ch?.hallPassCountUp };
  HP.name = c.childName || c.childFirstName || '';

  HP.restrict = c.hallPassRestrictData || {};

  const gu = c.studentHallPassGU || '';
  if (gu && !HP.ended.has(gu) && (kind === 'pending' || kind === 'active')) {
    if (kind === 'active' && !HP.seen.has(gu)) HP.seen.set(gu, Date.now());
    if (!HP.pass || HP.pass.gu !== gu) { // new pass: look up where it goes and for how long
      let last = {}; try { last = JSON.parse(sessionStorage.getItem('mv_hp_last') || '{}'); } catch { /* none */ }

        const mins = scan(x, /(time.?limit|minutes|duration|allowed|max.?time)/i, (v) => Number(v) > 0);

    'surface-container': T(tn.c), 'surface-container-high': T(tn.high), 'surface-container-highest': T(tn.highest),
    outline: hx(sc.outline), 'outline-variant': hx(sc.outlineVariant), 'surface-tint': hx(sc.primary),
    'inverse-surface': hx(sc.inverseSurface), 'inverse-on-surface': hx(sc.inverseOnSurface), 'inverse-primary': hx(sc.inversePrimary),
    shadow: '#000000', scrim: '#000000',
  };
  const css = Object.fromEntries(Object.entries(v).map(([k, x]) => ['--md-sys-color-' + k, x]));
  Object.assign(css, dark
    ? { '--ok': '#A8DAB5', '--ok-c': '#0F5223', '--warn': '#FFB74D', '--warn-c': '#5A4300', '--info': '#9ECAFF', '--info-c': '#00497A' }
    : { '--ok': '#146C2E', '--ok-c': '#C4EED0', '--warn': '#B26A00', '--warn-c': '#FFDF9E', '--info': '#00629D', '--info-c': '#CFE5FF' });
  paint(css);
}
mq.addEventListener('change', () => { if (CFG.mode === 'system') applyTheme(); });
applyTheme();

function applyNavOrder() {
  const nav = $('nav'), sp = nav.querySelector('.spacer');
  for (const t of CFG.order) { const b = nav.querySelector(`.nav-item[data-tool="${t}"]`); if (b) nav.insertBefore(b, sp); }
}
const setMode = (k) => { CFG.mode = k; saveCfg(); applyTheme(); renderSettings(); };
const setAccent = (c, live) => { CFG.accent = c.toUpperCase(); saveCfg(); applyTheme(); if (!live) renderSettings(); };
function moveTool(i, d) {
  const o = CFG.order, j = i + d;
  if (j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  saveCfg(); applyNavOrder(); renderSettings();
}
function resetLook() { CFG = { mode: 'system', accent: DEFAULT_ACCENT, order: [...TOOLS] }; saveCfg(); applyTheme(); applyNavOrder(); renderSettings(); }

function renderSettings() {
  if (tool !== 'settings') return;
  const preset = ACCENTS.some(([, c]) => c === CFG.accent);
  $('#content').replaceChildren(h('div', { class: 'set-wrap' },
    h('div', { class: 'set-card' }, h('h3', {}, 'Appearance'),
      h('div', { class: 'section-title' }, 'Mode'),
      h('div', { class: 'chiprow' }, ...MODES.map(([k, label]) => h('button', { class: 'pchip', type: 'button', 'aria-pressed': String(CFG.mode === k), onclick: () => setMode(k) }, label))),
      h('div', { class: 'row-sub' }, 'OLED uses pure black backgrounds, which saves battery on OLED screens.'),
      h('div', { class: 'section-title' }, 'Color'),
      h('div', { class: 'swatches' },
        ...ACCENTS.map(([name, c]) => h('button', { class: 'sw', type: 'button', title: name, 'aria-label': name, 'aria-pressed': String(CFG.accent === c), style: 'background:' + c, onclick: () => setAccent(c) },
          CFG.accent === c ? h('md-icon', {}, 'check') : null)),
        h('label', { class: 'sw custom', title: 'Custom color', 'aria-pressed': String(!preset) },
          h('input', { type: 'color', value: CFG.accent, 'aria-label': 'Custom color', oninput: (e) => setAccent(e.target.value, true), onchange: (e) => setAccent(e.target.value) }),
          h('md-icon', {}, preset ? 'palette' : 'check')))),
    h('div', { class: 'set-card' }, h('h3', {}, 'Menu order'),
      ...CFG.order.map((t, i) => h('div', { class: 'ord-row' },
        h('md-icon', {}, TOOL_META[t][0]), h('span', { class: 'grow' }, TOOL_META[t][1]),
        h('md-icon-button', { 'aria-label': 'Move ' + TOOL_META[t][1] + ' up', disabled: i === 0, onclick: () => moveTool(i, -1) }, h('md-icon', {}, 'arrow_upward')),
        h('md-icon-button', { 'aria-label': 'Move ' + TOOL_META[t][1] + ' down', disabled: i === CFG.order.length - 1, onclick: () => moveTool(i, 1) }, h('md-icon', {}, 'arrow_downward'))))),
    h('div', { class: 'set-card' }, h('h3', {}, 'This device'),
      h('div', { class: 'row-sub' }, REM
        ? `Saved login for ${REM.username} (${REM.district}), kept in an encrypted cookie. You'll see "Continue as ${REM.name || REM.username}" on the sign-in page.`
        : 'No login is saved on this device.'),
      REM ? h('md-outlined-button', { type: 'button', onclick: forgetDevice }, 'Forget this device') : null,
      h('md-text-button', { type: 'button', onclick: resetLook }, 'Reset appearance and menu order'))));
}

if (sid) enter(); else { show('login'); loadRemembered(); }
</script>
</body>
